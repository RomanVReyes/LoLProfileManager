<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoL Profile Manager</title>

  <link rel="stylesheet" href="./src/css/styles.css">
  <link rel="stylesheet" href="./src/css/summary.css">
  <link rel="stylesheet" href="./src/css/match-history.css">
  <link rel="stylesheet" href="./src/css/match-details.css">
</head>
<body>
  <main class="app">
    <section class="search-section panel panel--hero">
      <div class="brand-lockup">
        <span class="brand-kicker">Perfil de Invocador</span>
        <h1>LoL Profile Manager</h1>
      </div>

      <div class="search-box" role="search">
        <input 
          id="summoner-search" 
          type="text" 
          list="summoner-suggestions"
          placeholder="Buscar invocador o #tag"
          autocomplete="off"
        >
        <datalist id="summoner-suggestions"></datalist>

        <button id="search-button">Buscar</button>
      </div>

      <p id="message"></p>
    </section>

    <nav id="profile-tabs" class="profile-tabs" aria-label="Secciones del perfil" hidden>
      <button class="profile-tab is-active" type="button" data-tab="summary">Resumen</button>
      <button class="profile-tab" type="button" data-tab="matches">Ultimas 20 partidas</button>
    </nav>

    <section id="summary-content" class="summary-content profile-panel" data-panel="summary"></section>
    <section id="match-history-content" class="match-history-content profile-panel" data-panel="matches" hidden></section>
  </main>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
